name: grokbot-vm

services:
  searxng-core:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    container_name: grokbot-searxng-core
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env (see README)}
      - SEARXNG_PORT=${SEARXNG_PORT:-8080}
    ports:
      - ${SEARXNG_HOST:-127.0.0.1}:${SEARXNG_PORT:-8080}:${SEARXNG_PORT:-8080}
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - searxng-core-data:/var/cache/searxng/

  camoufox-server:
    build:
      context: .
      dockerfile: ./camoufox.Dockerfile
    container_name: grokbot-camoufox
    restart: unless-stopped
    init: true
    # Firefox needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    environment:
      - CAMOUFOX_WS_PATH=${CAMOUFOX_WS_PATH:?set CAMOUFOX_WS_PATH in .env (see README)}
      - CAMOUFOX_PORT=${CAMOUFOX_PORT:-9222}
      - CAMOUFOX_HEADLESS=${CAMOUFOX_HEADLESS:-true}
    ports:
      - ${CAMOUFOX_HOST:-127.0.0.1}:${CAMOUFOX_PORT:-9222}:${CAMOUFOX_PORT:-9222}

volumes:
  searxng-core-data:
